name: Monthly FRED Macro Refresh

on:
  schedule:
    - cron: '0 8 1 * *'   # 1st of every month, 8 AM UTC
  workflow_dispatch:        # allow manual trigger

jobs:
  fred:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Refresh FRED macro data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m backend.fred.refresh

      - name: Commit updated macro data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/ frontend/public/models/manifest.json || true
          git diff --staged --quiet || git commit -m "chore: refresh FRED macro indicators"
          git push || true
