name: Daily Sentiment Analysis

on:
  schedule:
    - cron: '0 6 * * *'   # 6 AM UTC daily (2 PM SGT)
  workflow_dispatch:        # allow manual trigger

jobs:
  sentiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run sentiment pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m backend.sentiment.run

      - name: Run event detection
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python -c "
          from backend.sentiment.scraper import fetch_rss_articles
          from backend.events.detector import detect_events, persist_events
          articles = fetch_rss_articles(max_age_days=3)
          events = detect_events(articles)
          if events:
              persist_events(events)
          "

      - name: Export active scenarios
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -c "from backend.events.scenario_engine import export_active_scenarios; export_active_scenarios()"

      - name: Commit updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/ || true
          git diff --staged --quiet || git commit -m "chore: update daily sentiment & scenario data"
          git push || true
